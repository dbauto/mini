name: Copy QMS snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-qms.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source snapshot
        run: |
          git clone https://github.com/dbauto/sdlhowrith-new.git /tmp/qms-source
          cd /tmp/qms-source
          git checkout 65c652590c6707a22f76730b8dad99adb30d4418

      - name: Replace destination with QMS snapshot
        run: |
          rsync -a --delete --exclude='.git' /tmp/qms-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy QMS snapshot from dbauto/sdlhowrith-new@65c6525"
          git push origin main
