name: V1 static checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/mini-v1.js"
      - "assets/mini-v1.css"
      - "assets/mini-workspace.js"
      - "assets/mini-workspace.css"
      - "assets/documents.js"
      - "assets/core.js"
      - "assets/shell.js"
      - "assets/account.js"
      - "vendor/lucide.min.js"
      - "scripts/smoke.sh"
      - ".github/workflows/v1-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "assets/mini-v1.js"
      - "assets/mini-v1.css"
      - "assets/mini-workspace.js"
      - "assets/mini-workspace.css"
      - "assets/documents.js"
      - "assets/core.js"
      - "assets/shell.js"
      - "assets/account.js"
      - "vendor/lucide.min.js"
      - "scripts/smoke.sh"
      - ".github/workflows/v1-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/mini-v1.js
          node --check assets/mini-workspace.js
          node --check assets/documents.js
          node --check assets/core.js
          node --check assets/shell.js
          node --check assets/account.js
      - name: V1 assets are loaded
        run: |
          grep -q 'assets/mini-v1.css' index.html
          grep -q 'assets/mini-v1.js' index.html
          grep -q 'assets/mini-workspace.css' index.html
          grep -q 'assets/mini-workspace.js' index.html

      - name: Browser smoke test (light and dark)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mini-http.log 2>&1 &
          sleep 1
          bash scripts/smoke.sh
