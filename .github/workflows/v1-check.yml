name: V1 static checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/mini-v1.js"
      - "assets/documents.js"
      - "assets/mini-v1.css"
      - ".github/workflows/v1-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/mini-v1.js
          node --check assets/documents.js
          node --check assets/core.js
      - name: V1 assets are loaded
        run: |
          grep -q 'assets/mini-v1.css' index.html
          grep -q 'assets/mini-v1.js' index.html

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mini-http.log 2>&1 &
          sleep 1
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/#/overview' >/tmp/mini-dom.html 2>/tmp/mini-browser.log
          grep -q 'Document Control Overview' /tmp/mini-dom.html
          grep -q 'New / Revise Document' /tmp/mini-dom.html
          grep -q 'Documents in Review' /tmp/mini-dom.html
